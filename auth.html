<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SyntaxSensei | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>

        :root {

            --primary: #6c5ce7;
            --bg: #f9fafc;
            --text: #1e293b;

        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;

        }

        body {

            background-color: var(--bg);

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .auth-card {

            background: white;

            width: 100%;

            max-width: 400px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.05);

        }

        .logo {

            color: var(--primary);

            font-weight: 700;

            font-size: 24px;

            text-align: center;

            margin-bottom: 20px;

        }

        h2 {

            text-align: center;

            margin-bottom: 20px;

            color: var(--text);

        }

        .form-group {

            margin-bottom: 15px;

        }

        label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 5px;

        }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            outline: none;

        }

        input:focus {

            border-color: var(--primary);

        }

        .btn {

            width: 100%;

            padding: 12px;

            background: var(--primary);

            color: white;

            border: none;

            border-radius: 8px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;

        }

        .switch-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            color: #64748b;

        }

        .switch-link span {

            color: var(--primary);

            cursor: pointer;

            font-weight: 600;

        }

        .hidden {

            display: none;

        }

        .error-msg {

            color: #ef4444;

            font-size: 12px;

            margin-top: 5px;

            display: none;

        }

    </style>

</head>

<body>

    <div class="auth-card">

        <div class="logo">
            SyntaxSensei
        </div>


        <!-- ================= LOGIN ================= -->

        <div id="login-section">

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                        id="loginEmail"
                        required
                        placeholder="user@example.com">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                        id="loginPassword"
                        required
                        placeholder="••••••••">

                </div>

                <p id="loginError"
                    class="error-msg">
                </p>

                <button type="submit"
                    class="btn">

                    Sign In

                </button>

            </form>

            <p class="switch-link">

                New here?

                <span onclick="toggleAuth()">
                    Create an account
                </span>

            </p>

        </div>


        <!-- ================= SIGNUP ================= -->

        <div id="signup-section"
            class="hidden">

            <h2>Create Account</h2>

            <form id="signupForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input type="text"
                        id="signupName"
                        required
                        placeholder="Your Name">

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                        id="signupEmail"
                        required
                        placeholder="user@example.com">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                        id="signupPassword"
                        required
                        placeholder="••••••••">

                </div>

                <button type="submit"
                    class="btn">

                    Register

                </button>

            </form>

            <p class="switch-link">

                Have an account?

                <span onclick="toggleAuth()">
                    Log in
                </span>

            </p>

        </div>

    </div>


    <!-- ================= SCRIPT ================= -->

    <script>

        // ================= TOGGLE ================= //

        function toggleAuth() {

            document.getElementById('login-section')
                .classList.toggle('hidden');

            document.getElementById('signup-section')
                .classList.toggle('hidden');

        }


        // ================= REGISTER USER ================= //

document.getElementById('signupForm')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const username =
        document.getElementById(
            'signupName'
        ).value;

    const email =
        document.getElementById(
            'signupEmail'
        ).value;

    const password =
        document.getElementById(
            'signupPassword'
        ).value;

    try {

        const response =
            await fetch(

                `http://127.0.0.1:8000/register?username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,

                {
                    method: 'POST'
                }

            );

        const data =
            await response.json();

        if (data.success) {

            alert(
                "Registration Successful!"
            );

            toggleAuth();

        } else {

            alert(
                data.message
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Registration failed!"
        );

    }

});


        // ================= LOGIN USER ================= //

        document.getElementById('loginForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const email =
                document.getElementById('loginEmail').value;

            const password =
                document.getElementById('loginPassword').value;

            // Generate username from email

            const username =
                email.split('@')[0];

            // Save session

            sessionStorage.setItem(
                'isLoggedIn',
                'true'
            );

            sessionStorage.setItem(
                'userName',
                username
            );

            sessionStorage.setItem(
                'userEmail',
                email
            );

            alert("Login Successful!");

            window.location.href = 'index.html';

        });

    </script>

</body>

</html>
